# Render blueprint: web service + background worker + Postgres + Redis.
# Fill in the sync:false secrets in the dashboard after the first deploy, then
# set SHOPIFY_APP_URL to the web service's public URL and run `shopify app deploy`.
services:
  - type: web
    name: dropship-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: dropship-hub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dropship-hub-redis
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SUPPLIER_DRIVER
        value: live
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: worker
    name: dropship-hub-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dropship-hub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dropship-hub-redis
          property: connectionString
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SUPPLIER_DRIVER
        value: live
      - key: ALIEXPRESS_APP_KEY
        sync: false
      - key: ALIEXPRESS_APP_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

  - type: redis
    name: dropship-hub-redis
    plan: starter
    ipAllowList: []

databases:
  - name: dropship-hub-db
    plan: starter
