<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.4 -apple-system, Segoe UI, Roboto, sans-serif; width: 320px; padding: 12px; margin: 0; color: #202223; }
      button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #008060; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { background: #c9cccf; cursor: default; }
      button.secondary { background: #f1f2f3; color: #202223; }
      #status, #orders-status { margin-top: 10px; min-height: 1.4em; }
      .ok { color: #008060; } .err { color: #d72c0d; }
      a { color: #2c6ecb; }
      small { color: #6d7175; }
      h2 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: #6d7175; }
      hr { border: 0; border-top: 1px solid #e1e3e5; margin: 12px 0; }
      ul { list-style: none; padding: 0; margin: 0; }
      li.order { padding: 8px 0; border-bottom: 1px solid #f1f2f3; }
      li.order:last-child { border-bottom: 0; }
      .order-name { font-weight: 600; }
      li.item { margin-top: 4px; }
      li.item a { cursor: pointer; }
      li.order > button { margin-top: 8px; padding: 7px; }
      details { margin-top: 6px; }
      summary { cursor: pointer; color: #2c6ecb; font-weight: 600; }
      form.action { display: grid; gap: 6px; margin-top: 6px; }
      label.field { display: grid; gap: 2px; font-size: 12px; color: #6d7175; }
      label.field input { font: inherit; font-size: 13px; color: #202223; padding: 6px 8px; border: 1px solid #c9cccf; border-radius: 6px; }
      label.check { display: flex; gap: 6px; align-items: center; font-size: 12px; }
      .result, #orders-result { min-height: 1.2em; font-size: 12px; }
      #orders-result { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="url"><small>Reading current tab…</small></div>
    <p><button id="add" disabled>Add to import list</button></p>
    <div id="status"></div>

    <hr />
    <div id="orders-result" role="status"></div>
    <h2 id="orders-heading">Orders to place</h2>
    <div id="orders-status"><small>Loading…</small></div>
    <ul id="orders"></ul>

    <h2 id="tracking-heading">Waiting for tracking</h2>
    <div id="tracking-status"></div>
    <ul id="tracking"></ul>

    <p><small><a href="#" id="options">Configure app URL &amp; token</a></small></p>
    <script src="popup.js"></script>
  </body>
</html>
